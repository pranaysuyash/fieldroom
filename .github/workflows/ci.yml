name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system OCR dependency
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cv,ocr,nlp,training]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Run test suite with coverage
        run: python -m pytest --cov=pdf_field_lab
      - name: Dependency audit
        run: |
          python -m pip install pip-audit
          pip-audit
        # Ratchet: non-blocking until the current open advisories are cleared;
        # flip continue-on-error off once the audit is green.
        continue-on-error: true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-form-field-lab"
version = "0.1.1"
description = "Local-first extraction and editable reconstruction for flat PDF forms"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pypdf>=6.0",
  "pdfplumber>=0.11",
  "PyMuPDF>=1.24",
  "Pillow>=10.0",
  "reportlab>=4.0",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
cv = ["numpy>=2.0", "opencv-python-headless>=4.10"]
ocr = ["pytesseract>=0.3"]
nlp = ["spacy>=3.7"]
training = ["joblib>=1.4", "scikit-learn>=1.6"]
cloud = ["modal>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Correctness-first ratchet (E4/E7/E9/F). Broader rule families (B, SIM, PLW,
# BLE) are registered as a follow-up review in docs/open-items.md; broaden the
# selection only with the findings fixed, never with per-rule ignores.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["src/pdf_field_lab"]

[tool.coverage.report]
# Ratchet: baseline measured 84% on 2026-09-17; raise only with new coverage.
fail_under = 80
show_missing = false

[project.scripts]
pdf-field-lab = "pdf_field_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
